name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7

      - run: pip install -r requirements-dev.txt
      - run: ruff check .


  testes-ci:
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  criar-imagem:
    needs: testes-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t biblioteca-ci:latest .
      - run: docker run -d --name biblioteca-ci -p 8000:8000 biblioteca-ci:latest
      - run: docker logs biblioteca-ci
  publicar-imagem:
    permissions:
      contents: read
      packages: write
    needs: criar-imagem
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: docker build -t "$IMAGEM:latest" -t "$IMAGEM:${GITHUB_SHA::7}" .
      - run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u "${{github.actor}}" --password-stdin
      - run: docker push --all-tags "$IMAGEM"

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: deploy
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @railway/cli
      - name: deploy
        env:
          RAILWAY_TOKEN: $${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --ci

        